/* ===== backup & export ===== */
const stamp = () => dayKey(Date.now());
function downloadBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
async function shareFile(text, base, kinds) {
  for (const [ext, mime] of kinds) {
    try {
      const file = new File([text], `${base}.${ext}`, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: file.name }); return "shared"; }
    } catch (e) { if (e.name === "AbortError") return "cancelled"; }
  }
  downloadBlob(new Blob([text], { type: kinds[0][1] }), `${base}.${kinds[0][0]}`);
  return "downloaded";
}
async function backup() {
  if (state.settings.demo) { toast("This is example data. Start your own tracker first."); return; }
  const payload = JSON.stringify({ app: "titration-tracker", exported: new Date().toISOString(), ...state }, null, 1);
  const r = await shareFile(payload, `titration-tracker-backup-${stamp()}`, [["json", "application/json"], ["txt", "text/plain"]]);
  if (r === "cancelled") return;
  state.settings.lastBackup = Date.now(); commit();
  toast(r === "shared" ? "Backup handed to the app you chose" : "Backup file downloaded");
}
function csvExport() {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [["date", "time", "type", "mode", "systolic", "diastolic", "pulse", "weight_kg", "score", "details", "medication", "note"]];
  [...state.entries].sort((a, b) => a.ts - b.ts).forEach(e => {
    const d = e.data || {};
    rows.push([dayKey(e.ts), fmtTime(e.ts), typeName(e.type), e.mode, e.type === "bp" ? d.sys : "", e.type === "bp" ? d.dia : "", e.type === "bp" ? d.pulse ?? "" : "", e.type === "weight" ? d.kg : "", e.type === "asrs" ? asrsScore(d.answers) : e.type === "pgi" ? d.score : "", e.type === "note" ? "" : summary(e), e.meds, e.note]);
  });
  shareFile(rows.map(r => r.map(q).join(",")).join("\n"), `titration-tracker-${stamp()}`, [["csv", "text/csv"]]);
}
async function restoreText(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast("That file isn't a Titration Tracker backup."); return; }
  if (!obj || !Array.isArray(obj.entries) || !obj.settings) { toast("That file isn't a Titration Tracker backup."); return; }
  const ok = await confirmBox("Replace your data?", `This backup${obj.exported ? ` from ${esc(fmtDate(Date.parse(obj.exported), true))}` : ""} has ${obj.entries.length} entries. Everything currently in the app will be replaced.`, "Restore backup", true);
  if (!ok) return;
  state = normalise(obj); state.settings.demo = false; commit(); askPersist(); toast("Backup restored");
}

/* ===== events ===== */
document.addEventListener("click", async ev => {
  const tab = ev.target.closest(".tab");
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, S = state.settings;
  if (a === "closebg") { if (ev.target === b) closeSheet(); return; }
  if (a === "toggletrk") return; // handled on change
  switch (a) {
    case "close": closeSheet(); break;
    case "logpicker": openPicker(); break;
    case "log": closeSheet(); openForm(b.dataset.t); break;
    case "edit": { const e = state.entries.find(x => x.id === b.dataset.id); if (e) openForm(e.type, e); break; }
    case "saveentry": saveEntry(b.dataset.t, b.dataset.id); break;
    case "delentry": {
      const e = state.entries.find(x => x.id === b.dataset.id);
      if (await confirmBox("Delete this entry?", `${esc(typeName(e.type))} from ${esc(fmtDate(e.ts, true))}: ${esc(summary(e))}`, "Delete", true)) { state.entries = state.entries.filter(x => x.id !== e.id); closeSheet(); commit(); toast("Entry deleted"); }
      break;
    }
    case "addr2": $("#r2wrap").hidden = false; b.hidden = true; $("#f-s2").focus(); break;
    case "addmed": closeSheet(); openMedForm(); break;
    case "editmed": openMedForm(S.meds.find(m => m.id === b.dataset.id)); break;
    case "savemed": saveMed(b.dataset.id); break;
    case "stopmed": {
      const m = S.meds.find(x => x.id === b.dataset.id);
      if (await confirmBox(`Stop ${m.name}?`, "It will be removed from your current medication and the change recorded in your history.", "Stop medicine", true)) {
        state.entries.push({ id: uid(), ts: Date.now(), type: "dose", mode: mode(), meds: "", data: { medId: m.id, name: m.name, from: m.dose, to: 0, unit: m.unit, reason: "Stopped" }, note: "" });
        S.meds = S.meds.filter(x => x.id !== m.id); closeSheet(); commit(); toast(`${m.name} stopped`);
      }
      break;
    }
    case "dosechange": closeSheet(); openDoseChange(); break;
    case "savedose": saveDose(); break;
    case "dosesame": S.lastDoseCheck = Date.now(); commit(); toast("Thanks. We'll ask again next week."); break;
    case "hist": ui.hist = b.dataset.t; render(); break;
    case "range": ui.range = Number(b.dataset.v); render(); break;
    case "schedmode": ui.schedMode = b.dataset.v; render(); break;
    case "schedday": {
      const s = S.trackers[b.dataset.t][b.dataset.m], d = Number(b.dataset.d);
      s.days = s.days.includes(d) ? s.days.filter(x => x !== d) : [...s.days, d]; commit(); break;
    }
    case "setmode": {
      const v = b.dataset.v; if (v === S.mode) break;
      const msg = v === "stable" ? "Stable mode switches to your stable schedule and stops asking about dose changes. Your history is kept. You can switch back any time." : "Titration mode switches back to the more frequent titration schedule and the weekly dose prompt. The titration start date will be set to today.";
      if (await confirmBox(v === "stable" ? "Titration complete?" : "Start titrating again?", msg, v === "stable" ? "Switch to stable" : "Switch to titration")) {
        state.entries.push({ id: uid(), ts: Date.now(), type: "mode", mode: v, meds: medString(), data: { from: S.mode, to: v }, note: "" });
        S.mode = v; ui.schedMode = null;
        if (v === "stable") S.stableSince = Date.now(); else { S.titrationStart = dayKey(Date.now()); S.lastDoseCheck = Date.now(); }
        commit(); toast(v === "stable" ? "Now in stable mode" : "Now in titration mode");
      }
      break;
    }
    case "copy": {
      const t = $("#" + b.dataset.src);
      try { await navigator.clipboard.writeText(t.value); toast("Copied"); } catch (e) { t.focus(); t.select(); toast("Selected. Use your phone's Copy."); }
      break;
    }
    case "csv": csvExport(); break;
    case "backup": backup(); break;
    case "copybackup": {
      const payload = JSON.stringify({ app: "titration-tracker", exported: new Date().toISOString(), ...state });
      openSheet("Backup as text", `<p class="small muted">Copy this and paste it into a note or email to yourself. To restore, use Restore and choose a file containing it, or paste it below on another device.</p><textarea class="copybox" id="bk" readonly>${esc(payload)}</textarea>`, `<button class="btn ghost" data-act="pastebackup">Paste to restore</button><button class="btn" data-act="copy" data-src="bk">Copy</button>`);
      break;
    }
    case "pastebackup":
      openSheet("Restore from text", `<p class="small muted">Paste the backup text below.</p><textarea class="copybox" id="pasted" placeholder="{&quot;app&quot;:&quot;titration-tracker&quot;…"></textarea>`, `<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="restorepasted">Restore</button>`);
      break;
    case "restorepasted": { const t = $("#pasted").value; closeSheet(); restoreText(t); break; }
    case "restore": $("#restorefile").click(); break;
    case "wipe":
      if (await confirmBox("Delete all data?", "Every reading, note and setting on this device will be erased. This can't be undone. Back up first if you might want it later.", "Delete everything", true)) {
        state = normalise({}); commit(); ui.tab = "today"; render(); toast("All data deleted");
      }
      break;
    case "startfresh":
      if (await confirmBox("Start your own tracker?", "The example data will be cleared. Next, add your medication and choose how often to measure.", "Clear examples")) {
        state = normalise({}); ui.tab = "settings"; commit(); window.scrollTo(0, 0); setTimeout(() => openMedForm(), 100);
      }
      break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, S = state.settings;
  if (t.dataset.act === "toggletrk") { S.trackers[t.dataset.t].on = t.checked; commit(); return; }
  if (t.dataset.sched) {
    const s = S.trackers[t.dataset.sched][t.dataset.m];
    if (t.dataset.f === "kind") s.kind = t.value;
    else { const max = s.kind === "perWeek" ? 7 : 31; s.n = Math.max(1, Math.min(max, Math.round(Number(t.value) || 1))); }
    commit(); return;
  }
  if (t.dataset.set) {
    const path = t.dataset.set.split(".");
    let v = t.value;
    if (path[0] === "thresholds") { v = Number(v); if (!(v > 0)) { render(); return; } }
    if (path[0] === "titrationStart" && !v) { render(); return; }
    let o = S; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v; commit(); return;
  }
  if (t.id === "restorefile" && t.files[0]) { const fr = new FileReader(); fr.onload = () => restoreText(fr.result); fr.readAsText(t.files[0]); t.value = ""; }
});
document.addEventListener("input", ev => { if (ui.sheetType === "bp" && ev.target.closest("#f")) bpLive(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheet").hidden && $("#confirm").hidden) closeSheet(); });

/* ===== boot ===== */
(async function boot() {
  await Store.init();
  const saved = await Store.load();
  state = saved ? normalise(saved) : demoState();
  if (!saved) Store.save(JSON.parse(JSON.stringify(state)));
  render();
  if ("serviceWorker" in navigator && /^https:|^http:\/\/localhost/.test(location.href) && window.TT_STANDALONE) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }
})();
</script>
